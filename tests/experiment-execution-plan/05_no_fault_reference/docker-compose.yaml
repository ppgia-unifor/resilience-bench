# Experiment-specific Compose override. Run from the repository root.
services:
  scheduler:
    volumes:
      - ./tests/experiment-execution-plan/05_no_fault_reference/config.json:/opt/app/conf/conf.json:ro
      - ./tests/experiment-execution-plan/05_no_fault_reference/results:/opt/app/resilience-tests
    environment:
      DISK_PATH: /opt/app/resilience-tests
      AWS_BUCKET_NAME: ""
      AWS_OUTPUT_PATH: ""
